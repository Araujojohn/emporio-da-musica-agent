[project]
name = "emporio-agent"
version = "1.0.0"
description = "Customer service agent for Empório da Música, a fictional musical instrument store"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pypdf>=5.0",
    "rank-bm25>=0.2.2",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
